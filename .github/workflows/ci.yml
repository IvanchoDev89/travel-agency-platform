name: CI

on:
  push:
    branches: [hardening/phase-1, main]
  pull_request:
    branches: [hardening/phase-1, main]

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: i18n check
        run: php tools/i18n-check.php --quiet

      - name: Ajax nonce check
        run: php tools/ajax-nonce-check.php

      - name: Includes check
        run: php tools/includes-check.php

      - name: Composer audit
        run: composer audit --no-interaction

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs --warning-severity=0 --report=summary