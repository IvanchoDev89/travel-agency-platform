name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    name: PHPStan (level 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Regenerate autoloader
        run: composer dump-autoload -o

      - name: Run PHPStan
        run: composer analyse

  coding-standards:
    name: PHPCS (WordPress, informational)
    runs-on: ubuntu-latest
    # The codebase still carries WPCS debt (largely legacy formatting rules that
    # conflict with the project style). This job reports progress without
    # blocking; remove `continue-on-error` once the report is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Regenerate autoloader
        run: composer dump-autoload -o

      - name: Run PHP_CodeSniffer
        run: composer lint

  static-guards:
    name: Static guards (i18n + ajax nonces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Regenerate autoloader
        run: composer dump-autoload -o

      - name: Check every translated string is in the catalogs
        run: php tools/i18n-check.php

      - name: Check every ajax handler verifies a nonce
        run: php tools/ajax-nonce-check.php

      - name: Check every class file in includes/ is loaded
        run: php tools/includes-check.php
