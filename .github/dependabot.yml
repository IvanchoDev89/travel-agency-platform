version: 2
updates:
  # Dev tooling only: the plugin has no runtime Composer dependencies and
  # vendor/ is not shipped. These PRs keep PHPStan/PHPCS current in CI.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # Keep actions pinned to current releases (in particular checkout/setup-php).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
